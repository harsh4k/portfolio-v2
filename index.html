<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Harshit Yo!</title>
    <meta name="description" content="Every project starts with curiosity. This is where I share what I build, what I learn, and what's next." />
    <meta name="keywords" content="Harshit Chauhan, Full Stack Developer, Software Engineer, Computer Engineering, Portfolio, React, TypeScript, Next.js, Node.js, JavaScript, PostgreSQL, Supabase, Three.js, GSAP, Frontend, Backend, Web Development, Software Development, NMIMS, Mumbai" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://harshh.pages.dev" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />

    <!-- Installed-app chrome. theme-color is re-set per route by
         ThemeColorUpdater in App.tsx, because "/" is dark and the inner pages
         are light; this value matches the manifest's start_url. -->
    <meta name="theme-color" content="#11110F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Harshit" />

    <script>
      // start_url is "/", whose intro is near-black, but index.css paints
      // html/body #EEE9DC — that flashes light for a frame on every cold
      // launch before React renders the dark gradient. An inline style on the
      // element outranks the stylesheet rule and lands before first paint.
      if (location.pathname === "/") {
        document.documentElement.style.backgroundColor = "#11110F";
      }
    </script>

    <!-- Fonts: self-hosted, declared in index.css -->
    <link rel="preload" href="/fonts/archivo-black-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-var-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Open Graph -->
    <meta property="og:title" content="Harshit Chauhan" />
    <meta property="og:description" content="Every project starts with curiosity. This is where I share what I build, what I learn, and what's next." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Harshit Chauhan" />
    <meta property="og:url" content="https://harshh.pages.dev" />
    <meta property="og:image" content="https://harshh.pages.dev/images/profile.webp" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Harshit Chauhan" />
    <meta name="twitter:description" content="Every project starts with curiosity. This is where I share what I build, what I learn, and what's next." />
    <meta name="twitter:image" content="https://harshh.pages.dev/images/profile.webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
